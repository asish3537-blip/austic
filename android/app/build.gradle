plugins { id 'com.android.application' }
android {
    namespace 'in.paustik.mobile'
    compileSdk 36
    buildToolsVersion '36.0.0'
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'in.paustik.mobile'
        minSdk 24
        targetSdk 36
        versionCode 12
        versionName '1.4.2'
    }
    signingConfigs {
        release {
            if (System.getenv('PAUSTIK_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('PAUSTIK_ANDROID_KEYSTORE'))
                storePassword System.getenv('PAUSTIK_ANDROID_STORE_PASS')
                keyAlias 'pausstik'
                keyPassword System.getenv('PAUSTIK_ANDROID_STORE_PASS')
            }
        }
    }
    buildTypes {
        release {
            buildConfigField 'boolean', 'TEST_PAYMENTS_ONLY', 'false'
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'API_BASE_URL', '"https://paustik.in"'
        }
        debug {
            buildConfigField 'boolean', 'TEST_PAYMENTS_ONLY', 'true'
            applicationIdSuffix '.debug'
            signingConfig signingConfigs.release
            buildConfigField 'String', 'API_BASE_URL', '"https://paustik.in"'
        }
        qa {
            initWith release
            matchingFallbacks = ['release']
            versionNameSuffix '-test6'
            buildConfigField 'boolean', 'TEST_PAYMENTS_ONLY', 'true'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.razorpay:checkout:1.6.41'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
