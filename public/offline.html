<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#174b3b">
    <title>You’re offline · Pausstik</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbf8f0;color:#35291f;font:16px/1.6 Arial,sans-serif;padding:24px;box-sizing:border-box}.card{max-width:430px;border:1px solid #e8e0d1;border-radius:24px;background:#fffdf8;padding:32px;box-shadow:0 22px 70px #35291f12}.mark{display:grid;place-items:center;width:58px;height:58px;border-radius:18px;background:#174b3b;color:#fff;font-size:30px}.eyebrow{margin:23px 0 7px;color:#1d5b45;font-size:12px;font-weight:bold;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:32px;line-height:1.1;letter-spacing:-.04em}p{color:#776f64}.button{display:inline-flex;margin-top:12px;border-radius:12px;background:#1d5b45;padding:13px 18px;color:white;font-weight:bold;text-decoration:none}
    </style>
  </head>
  <body><main class="card"><div class="mark" aria-hidden="true">♨</div><p class="eyebrow">Pausstik app</p><h1>You’re offline right now.</h1><p>Reconnect to browse nearby kitchens, manage menus or update a delivery. Your account and order data are never stored for offline use.</p><a class="button" href="/app-demo">Open the app preview</a></main></body>
</html>
