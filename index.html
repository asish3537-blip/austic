function load(){try{const stored=JSON.parse(localStorage.getItem(KEY)||'{}'),loaded={...structuredClone(seed),...stored};if(!stored.deliveries&&stored.orders){const order=loaded.orders.find(o=>o.status!=='Cancelled')||loaded.orders[0];if(order){const d=structuredClone(seed.deliveries[0]);d.id='DL-'+order.id;d.orderId=order.id;d.status=order.status;d.events.forEach((e,i)=>{e.complete=order.status==='Delivered'||order.status==='Out for delivery'&&i<=2||order.status==='Ready for pickup'&&i===0;e.at=e.complete?(i===0?'Earlier today':'Demo history'):''});if(order.status==='Delivered'){d.progress=6;d.etaMinutes=0;d.lastBoundaryEvent='Handover completed in demo history';d.events[3].detail='Prior delivery status; historical GPS data is unavailable.';d.events[4].detail='Order was marked delivered in saved demo data.'}else if(order.status==='Out for delivery'){d.progress=1;d.etaMinutes=10}else if(order.status==='Ready for pickup'){d.etaMinutes=12}loaded.deliveries=[d]}}return loaded}catch{return structuredClone(seed)}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let e=document.querySelector('#toast');e.textContent=s;e.hidden=false;setTimeout(()=>e.hidden=true,2600)}function go(r){if(r!=='tracking'&&liveWatchId!==null){navigator.geolocation.clearWatch(liveWatchId);liveWatchId=null;livePosition=null}route=r;document.querySelector('.navlinks')?.classList.remove('open');document.querySelector('.mobileMenu')?.setAttribute('aria-expanded','false');render();window.scrollTo(0,0)}function toggleMobileNav(){let n=document.querySelector('.navlinks'),b=document.querySelector('.mobileMenu'),open=n.classList.toggle('open');b.setAttribute('aria-expanded',String(open))}function money(n){return n?'₹'+Number(n).toLocaleString('en-IN'):'Custom'}function statusTag(s){return `<span class="tag ${s==='Delivered'||s==='Active'||s==='Approved'? function render(){nav();let a=document.querySelector('#app');if(route==='home')a.innerHTML=home();else if(route==='menu')a.innerHTML=menu();else if(route==='parent')a.innerHTML=parentView();else if(route==='mother')a.innerHTML=motherView();else if(route==='admin')a.innerHTML=adminView();else if(route==='tracking')a.innerHTML=trackingView();else a.innerHTML=home()}

function home(){return `<section class="hero"><div class="shell heroGrid"><div class="heroCopy"><div class="eyebrow">Paustik Local · Nearby meals by local mothers</div><h1>Good food,<br><em>growing good.</em></h1><p>Home-style veg and non-veg meals from local mothers, delivered to nearby customers.</p><div class="row heroActions"><button class="btn" onclick="go('menu')">Explore the menu <span aria-hidden="true">→</span></button><button class="btn alt" onclick="document.querySelector('#journey').scrollIntoView({behavior:'smooth'})">How Paustik works</button></div><div class="pills"><span class="pill">🥬 Seasonal, home-style meals</span><span class="pill">👩‍🍳 Mother-led kitchens</span><span class="pill">♻️ Reusable-tiffin concept</span></div><div class="heroNote"><span class="dot"></span>Demo experience · Sample orders and records only</div></div><div class="heroVisual"><img src="assets/mother-child-meal.svg" alt="Illustration of a mother and child sharing a home-style meal"><div class="visualBadge">Made with care<span>For healthier tomorrows</span></div></div></div></section><section class="section white"><div class="shell"><div class="sectionhead"><div><div class="eyebrow">Cooked close to home</div><h2>This week's sample menu</h2><p class="muted">Fourteen fictional dishes: vegetarian and non-vegetarian options every day. Browse the full sample week.</p></div><button class="btn alt" onclick="go('menu')">See meals & plans →</button></div><div class="cards">${db.meals.slice(0,6).map(mealCard).join('')}</div></div></section>${motherShowcase()}<section class="section journeySection" id="journey"><div class="shell"><div class="sectionhead"><div><div class="eyebrow">The Paustik journey</div><h2>From local kitchens to brighter tables</h2><p class="muted">A caring food network built around people, consistent processes, and thoughtful technology.</p></div></div><div class="journeyGrid"><article class="card journeyCard"><span class="stepNo">1</span><h3>The need</h3><p class="muted">People nearby need safe, nourishing home-style meals. Local mothers need flexible ways to earn and grow.</p></article><article class="card journeyCard"><span class="stepNo">2</span><h3>Mother-led marketplace</h3><p class="muted">Local food entrepreneurs connect with nearby customers and institutions through one managed service.</p></article><article class="card journeyCard"><span class="stepNo">3</span><h3>People + process</h3><p class="muted">Kitchens, quality standards, technology, logistics partners, and institutional customers work together.</p></article><article class="card journeyCard"><span class="stepNo">4</span><h3>Kitchen to doorstep</h3><p class="muted">Onboard → prepare → pack hygienically → collect and deliver → learn from feedback.</p></article><article class="card journeyCard"><span class="stepNo">5</span><h3>Community impact</h3><p class="muted">Better everyday meals, more opportunity for mothers, and a more thoughtful food system.</p></article></div><div class="notice"><b>Paustik principle:</b> Purity · Hygiene · Delivered. Kitchen verification, real logistics, and food-safety controls are goals for the operating service; this prototype does not perform them.</div></div></section><section class="section"><div class="shell"><div class="sectionhead"><div><div class="eyebrow">Designed for everyone at the table</div><h2>Good food grows stronger communities</h2></div></div><div class="valueStrip"><article class="valueCard"><div class="valueIcon">🥣</div><div><h3>Nearby customers</h3><p>Convenient, home-style food close to home for individuals, families, and teams.</p></div></article><article class="valueCard"><div class="valueIcon">🌱</div><div><h3>Mother entrepreneurs</h3><p>Flexible income and a platform to build a local food business.</p></div></article><article class="valueCard"><div class="valueIcon">♻️</div><div><h3>Community & planet</h3><p>Regional sourcing and reusable packaging as ideas for less waste.</p></div></article></div></div></section><section class="section portalSection"><div class="shell"><div class="sectionhead"><div><div class="eyebrow">Explore the prototype</div><h2>Choose your Paustik view</h2><p class="muted">Try the sample journeys. Changes stay in this browser.</p></div><button class="btn outline" onclick="openSignIn()">Choose a demo profile</button></div><div class="cards"><article class="card portalCard"><div class="emoji">🍽️</div><h3>For nearby customers</h3><p class="muted">Browse veg and non-veg meals, choose a plan, and view order status.</p><button class="btn" onclick="go('parent')">Open user view</button></article><article class="card portalCard"><div class="emoji">👩‍🍳</div><h3>For mother entrepreneurs</h3><p class="muted">Review a sample kitchen queue, update capacity, and apply to join.</p><button class="btn" onclick="go('mother')">Open mother view</button></article><article class="card portalCard"><div class="emoji">📊</div><h3>For operations</h3><p class="muted">Review fictional orders, applications, and contact messages.</p><button class="btn" onclick="go('admin')">Open admin view</button></article></div></div></section>`}
function mealCard(m){const type=m.diet==='nonveg'?'nonveg':'veg',label=type==='nonveg'?'Non-veg':'Veg';return `<article class="card"><div class="emoji">${esc(m.emoji)}</div><div class="mealTags"><span class="tag">${esc(m.day)}</span><span class="tag ${type}">${label}</span><span class="tag">${esc(m.cuisine)}</span></div><h3>${esc(m.name)}</h3><p class="muted">${esc(m.description)}</p><div class="row" style="justify-content:space-between"><b>${money(m.price)}</b><button class="btn alt" onclick="orderMeal(${m.id})">Choose meal</button></div></article>`}
function menu(){const visibleMeals=db.meals.filter(meal=>menuDietFilter==='all'||(meal.diet==='nonveg'?'nonveg':'veg')===menuDietFilter);return `<section class="section"><div class="shell"><div class="sectionhead"><div><div class="eyebrow">Paustik Local · Meals & plans</div><h2>Nearby meals, made by mothers</h2><p class="muted">Explore vegetarian and non-vegetarian home-style meals across the full week. Selections stay in this browser; no payment is collected.</p></div></div><div class="notice"><b>Sample menu:</b> Dish names, prices, availability, ingredients, allergens, and nutrition are examples and should be confirmed before a real launch.</div><div class="weekIntro"><strong>Monday to Sunday · 14 sample dishes · veg and non-veg options each day</strong><span class="muted small">Fictional menu · confirm ingredients and allergens before a real launch.</span></div><div class="mealFilters" role="group" aria-label="Filter menu by meal type"><button class="filterBtn ${menuDietFilter==='all'?'active':''}" aria-pressed="${menuDietFilter==='all'}" onclick="setMenuDietFilter('all')">All meals</button><button class="filterBtn ${menuDietFilter==='veg'?'active':''}" aria-pressed="${menuDietFilter==='veg'}" onclick="setMenuDietFilter('veg')">Veg</button><button class="filterBtn ${menuDietFilter==='nonveg'?'active':''}" aria-pressed="${menuDietFilter==='nonveg'}" onclick="setMenuDietFilter('nonveg')">Non-veg</button></div><div class="cards">${visibleMeals.map(mealCard).join('')}</div><div class="sectionhead" style="margin-top:48px"><div><div class="eyebrow">Flexible routines</div><h2>Choose a sample plan</h2><p class="muted">Use the demo controls to explore a meal plan for your home or neighborhood.</p></div></div><div class="cards">${db.plans.map(p=>`<div class="card"><span class="tag">${p.meals} meals</span><h3>${esc(p.name)}</h3><div class="price">${money(p.price)}</div><p class="muted">Sample plan · No payment is collected.</p><button class="btn" onclick="choosePlan(${p.id} function setMenuDietFilter(value){if(!['all','veg','nonveg'].includes(value))return;menuDietFilter=value;render()}
function kpi(label,value,note=''){return `<div class="kpi"><span>${label}</span><strong>${value}</strong><span>${note}</span></div>`}function rowsOrders(orders,controls=false){return `<div class="tablewrap"><table class="table"><thead><tr><th>Order</th><th>Meal</th><th>Date</th><th>Status</th><th>Amount</th>${controls?'<th>Update</th>':''}</tr></thead><tbody>${orders.length?orders.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.meal)}</td><td>${esc(o.date)}</td><td>${statusTag(o.status)}</td><td>${money(o.amount)}</td>${controls?`<td><select onchange="setOrderStatus('${esc(o.id)}',this.value)">${['Preparing','Ready for pickup','Out for delivery','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td>`:''}</tr>`).join(''):`<tr><td colspan="6" class="empty">No sample orders yet.</td></tr>`}</tbody></table></div>`}
function parentView(){let p=db.parents[0],sub=db.subscription||{plan:p.plan,status:p.status},d=getTrackedDelivery();return '<section class="dashboard shell"><div class="dashhead"><div><div class="eyebrow">Customer dashboard</div><h1>Hello, '+esc(p.name.split(' ')[0])+' 👋</h1><div class="muted">Sample account · Nearby meal orders</div></div><div class="actions"><button class="btn" onclick="go(&quot;tracking&quot;)">Track delivery</button><button class="btn alt" onclick="openSignIn()">Switch demo role</button></div></div><div class="kpis">'+kpi('Subscription',esc(sub.plan),statusTag(sub.status))+kpi("Today's meal",esc(db.orders[0]?.meal||'No meal'))+kpi('Delivery status',esc(d?.status||db.orders[0]?.status||'—'),'Sample order tracking')+kpi('Next renewal','In 12 days','Demo estimate')+'</div><article class="card deliveryShortcut"><div class="paneltitle"><div><div class="eyebrow">Order '+esc(d?.orderId||'P-1042')+'</div><h3>Follow your meal from kitchen to door</h3><p class="muted small">See courier progress, the delivery-zone boundary, and sample handover confirmation.</p></div><span class="tag orange">'+esc(d?.status||'Preparing')+'</span></div><button class="btn" onclick="go(&quot;tracking&quot;)">Open delivery tracker →</button></article><div class="columns"><div class="card"><div class="paneltitle"><h3>Recent meal orders</h3><button class="btn alt" onclick="go(&quot;menu&quot;)">Choose a meal</button></div>'+rowsOrders(db.orders.filter(o=>o.parentId===p.id))+'</div><div class="card"><div class="paneltitle"><h3>Manage plan</h3></div><p class="muted">Current sample plan</p><select id="parentPlan" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px">'+db.plans.map(x=>'<option '+(x.name===sub.plan?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select><div class="actions" style="margin-top:12px"><button class="btn" onclick="changePlan()">Save plan</button><button class="btn outline" onclick="toggleSub()">'+(sub.status==='Active'?'Pau     return '<article class="workflowCard"><div class="paneltitle"><div><div class="eyebrow">'+esc(o.id)+' · '+esc(o.date)+'</div><h3>'+esc(o.meal)+'</h3></div>'+statusTag(o.status)+'</div><div class="workflowMeta"><span class="tag">Customer '+esc(db.parents.find(function(p){return p.id===o.parentId})?.name||'—')+'</span><span class="tag">'+money(o.amount)+'</span><span class="tag orange">Courier: '+esc(o.assignmentStatus||'unassigned')+'</span><span class="tag">Payment not processed</span></div><div class="workflowActions"><select id="assign-'+esc(o.id)+'" aria-label="Assign delivery agent for '+esc(o.id)+'" style="min-width:220px;padding:10px;border:1px solid var(--line);border-radius:9px">'+options+'</select><button class="btn" onclick="assignAgent(&quot;'+esc(o.id)+'&quot;,document.getElementById(&quot;assign-'+esc(o.id)+'&quot;).value)">Send assignment</button></div></article>'
  }).join('');
  const review=pending.length?pending.map(function(a){return '<article class="workflowCard"><div class="eyebrow">'+esc(roleLabel(a.role))+'</div><h3>'+esc(a.name)+'</h3><p class="muted small">'+esc(a.email)+' · '+esc(a.area||'')+'</p><div class="workflowActions"><button class="btn" onclick="reviewProfile(&quot;'+esc(a.id)+'&quot;,true)">Approve demo profile</button><button class="btn danger" onclick="reviewProfile(&quot;'+esc(a.id)+'&quot;,false)">Decline</button></div></article>'}).join(''):'<p class="empty">No profile approvals waiting.</p>';
  const sampleApps=db.applications.filter(function(x){return !x.accountId});
  return '<section class="dashboard shell"><div class="dashhead"><div><div class="eyebrow">Operations workspace · sample only</div><h1>Dispatch & approvals</h1><div class="muted">Staff tools are separate from the three public account types.</div></div><span class="accountPill">Operations demo</span></div><div class="kpis">'+kpi('Customers',db.parents.length,'sample profiles')+kpi('Mother kitchens',db.mothers.length,'approved and pending')+kpi('Open orders',orders.filter(function(o){return o.status!=='Delivered'}).length,'dispatch queue')+kpi('Profiles to review',pending.length,'sample approvals')+'</div><div class="notice"><b>Assignment rule:</b> an approved agent receives an offer and must accept it. The mother kitchen separately marks the meal ready. Only then can the courier confirm pickup.</div><div class="card" style="margin-top:17px"><div class="paneltitle"><h3>Order assignment board</h3><span class="tag">'+orders.length+' sample orders</span></div><div class="workflowGrid">'+(cards||'<p class="empty">No orders to assign.</p>')+'</div></div><div class="card" style="margin-top:17px"><div class="paneltitle"><h3>Mother and courier profile approvals</h3><span class="tag orange">'+pending.length+' waiting</span></div><div class="workflowGrid">'+review+'</div></div><div class="card" style="margin-top:17px"><h3>Mother applications</h3>'+(sampleApps.length?sampleApps.map(function(x){return '<div class="workflowCard"><b>'+esc(x.name)+'</b><p class="small muted">'+esc(x.city)+' · '+esc(x.speciality)+' · '+esc(x.status)+'</p>'+(x.status==='Pending'?'<button class="btn alt" onclick="reviewApplication('+x.id+',&quot;Approved&quot;)">Approve sample application</button>':'')+'</div>'}).join(''):'<p class="empty">No additional sample applications.</p>')+'</div><div class="card payoutCard" style="margin-top:17px"><strong>Payments & settlements are placeholders</strong><p class="small muted">Orders and estimated seller totals are local sample data. No payment processor, split-payment ledger, refunds, taxes, or payouts are connected.</p></div></section>'
}
function assignAgent(orderId,agentId){
  if(currentAccount()?.role!=='ops'){toast('Only operations can assign a delivery agent.');return}
  const o=db.orders.find(function(x){return x.id===orderId}),c=db.deliveryAgents.find(function(x){return x.id===agentId&&x.status==='Approved'&&x.available});
  if(!o||!c){toast('Choose an approved, available delivery agent.');return}
  o.deliveryAgentId=c.id;o.assignmentStatus='offered';const d=db.deliveries.find(function(x){return x.orderId===o.id});
  if(d){d.courier=c.name;d.status=o.status}
  save();toast('Delivery offer sent to '+c.name+'.');render()
}
function reviewProfile(accountId,approve){
  if(currentAccount()?.role!=='ops'){toast('Only operations can review profiles.');return}
  const a=db.accounts.find(function(x){return x.id===accountId});if(!a)return;
  a.status=approve?'Approved':'Declined';
  if(a.role==='mother'){const m=db.mothers.find(function(x){return x.id===a.motherId});if(m){m.verified=approve;m.available=approve;m.approvalStatus=a.status}db.applications.forEach(function(x){if(x.accountId===a.id)x.status=approve?'Approved':'Declined'})}
  if(a.role==='delivery_agent'){const c=db.deliveryAgents.find(function(x){return x.id===a.agentId});if(c){c.status=a.status;c.available=approve}}
  save();toast(roleLabel(a.role)+' profile '+(approve?'approved':'declined')+'.');render()
}
function reviewApplication(id,status){
  if(currentAccount()?.role!=='ops'){toast('Only operations can review applications.');return}
  const a=db.applications.find(function(x){return x.id===id});if(!a)return;a.status=status;
  if(a.accountId){const account=db.accounts.find(function(x){return x.id===a.accountId});if(account)reviewProfile(account.id,status==='Approved');return}
  if(status==='Approved'&&!db.mothers.some(function(m){return m.name===a.name}))db.mothers.push({id:Date.now(),name:a.name,email:'new.mother@demo.paustik.example',city:a.city,capacity:20,verified:true,available:true,earnings:0});
  save();toast('Sample application '+status.toLowerCase()+'.');render()
}
function respondToAssignment(orderId,accept){
  const agent=activeAgent(),o=db.orders.find(function(x){return x.id===orderId});
  if(currentAccount()?.role!=='delivery_agent'||!agent||!o||o.deliveryAgentId!==agent.id||o.assignmentStatus!=='offered'){toast('This delivery offer is no longer available.');return}
  o.assignmentStatus=accept?'accepted':'declined';if(!accept)o.deliveryAgentId=null;
  save();toast(accept?'Delivery accepted. Wait for the kitchen to mark it ready.':'Delivery declined. Operations can assign another courier.');render()
}
function markOrderReady(orderId){
  const m=activeMother(),o=db.orders.find(function(x){return x.id===orderId});
  if(currentAccount()?.role!=='mother'||!m||!o||o.motherId!==m.id||o.status!=='Preparing'){toast('This order cannot be updated from this kitchen.');return}
  o.status='Ready for pickup';const d=db.deliveries.find(function(x){return x.orderId===o.id});
  if(d){d.status='Ready for pickup';stage(d,'packed',true,'Mother kitchen marked the sealed meal ready for courier pickup.')}
  save();toast('Order is ready. The assigned agent can now confirm pickup.');render()
}
function pickUpOrder(orderId){
  const c=activeAgent(),o=db.orders.find(function(x){return x.id===orderId});
  if(currentAccount()?.role!=='delivery_agent'||!c||!o||o.deliveryAgentId!==c.id||o.assignmentStatus!=='accepted'||o.status!=='Ready for pickup'){toast('Accept the offer and wait for the kitchen to mark it ready before pickup.');return}
  o.assignmentStatus='picked_up';o.status='Out for delivery';const d=db.deliveries.find(function(x){return x.orderId===o.id});
  if(d){d.status='Out for delivery';d.courier=c.name;d.progress=0;d.etaMinutes=12;stage(d,'pickup',true,'Courier confirmed collection from the mother kitchen.');stage(d,'transit',true,'Courier began the sample delivery route.')}
  save();db.currentOrderId=o.id;toast('Pickup confirmed. You can now share or simulate the route.');go('agent')
}
function trackOrder(orderId){
  if(!orderId){toast('Place an order before opening delivery tracking.');return}
  const o=db.orders.find(function(x){return x.id===orderId}),role=currentAccount()?.role;
  if(!o||(role==='customer'&&!customerOrders().some(function(x){return x.id===orderId}))||(role==='delivery_agent'&&o.deliveryAgentId!==activeAgent()?.id)){toast('You do not have access to this delivery.');return}
  db.currentOrderId=orderId;save();go('tracking')
}
function orderMeal(id){
  const m=db.meals.find(function(x){return x.id===id});
  if(!db.session){openSignIn('signin');return}
  if(currentAccount()?.role!=='customer'){toast('Please sign in as a nearby customer to place an order.');return}
  if(!m){toast('That sample meal is no longer available.');return}
  const p=activeParent(),mother=db.mothers.find(function(x){return x.verified&&x.available})||db.mothers.find(function(x){return x.verified});
  if(!mother){toast('No approved demo kitchen is available for this sample order.');return}
  const idNew='P-'+Date.now().toString().slice(-7),order={id:idNew,parentId:p.id,userAccountId:currentAccount().id,motherId:mother.id,meal:m.name,diet:m.diet||'veg',date:new Date().toISOString().slice(0,10),status:'Preparing',amount:m.price,paymentStatus:'Not processed · demo only',assignmentStatus:'unassigned',deliveryAgentId:null};
  db.orders.unshift(order);
  db.deliveries.unshift({id:'DL-'+idNew,orderId:idNew,courier:'Awaiting assignment',zoneName:(p.area||'Nearby demo zone')+' · sample zone',destination:{lat:20.3555,lon:85.818},status:'Preparing',etaMinutes:12,radiusMeters:db.deliveries[0]?.radiusMeters||350,progress:0,insideFixCount:0,exitFixCount:0,zoneEntered:false,lastPingAt:'Not started',events:[{key:'packed',label:'Meal packed and ready',detail:'The mother kitchen is preparing the sample order.',complete:false,at:''},{key:'pickup',label:'Courier pickup',detail:'Awaiting agent assignment and acceptance.',complete:false,at:''},{key:'transit',label:'On the way',detail:'Route starts after courier pickup.',complete:false,at:''},{key:'geofence',label:'Entered delivery zone',detail:'Geofence check pending.',complete:false,at:''},{key:'handover',label:'Handover verified',detail:'Customer confirmation pending.',complete:false,at:''}]});
  db.currentOrderId=idNew;save();toast('Sample order created. No payment was collected.');go('parent')
}
function choosePlan(id){
  if(currentAccount()?.role!=='customer'){toast('Sign in as a nearby customer to choose a plan.');return}
  const p=activeParent(),plan=db.plans.find(function(x){return x.id===id});if(!p||!plan)return;
  p.plan=plan.name;p.status='Active';if(p.id===1)db.subscription={plan:plan.name,status:'Active'};
  save();toast('Sample plan saved. No payment was collected.');go('parent')
}
function changePlan(){const p=activeParent(),select=document.querySelector('#parentPlan');if(!p||!select)return;p.plan=select.value;p.status=p.status==='New'?'Active':p.status;if(p.id===1)db.subscription={plan:p.plan,status:p.status};save();toast('Sample plan updated.');render()}
function toggleSub(){const p=activeParent();if(!p)return;p.status=p.status==='Active'?'Paused':'Active';if(p.id===1)db.subscription={plan:p.plan,status:p.status};save();toast('Sample plan status updated.');render()}
function confirmDemoHandover(){
  const d=getTrackedDelivery(),field=document.querySelector('#deliveryOtp'),role=currentAccount()?.role;
  if(role!=='customer'){toast('The customer confirms the sample handover. Sign in to the customer workspace.');return}
  if(!d||d.status!=='Inside delivery zone'){toast('The courier must first enter the delivery zone.');return}
  if(field?.value.trim()!=='2468'){toast('For this demo, enter the sample handover code 2468.');field?.focus();return}
  if(liveWatchId!==null){navigator.geolocation.clearWatch(liveWatchId);liveWatchId=null}livePosition=null;
  d.status='Delivered';d.zoneEntered=false;d.etaMinutes=0;stage(d,'handover',true,'Sample customer code accepted; no real handover occurred.');
  const o=db.orders.find(function(x){return x.id===d.orderId});if(o){o.status='Delivered';o.assignmentStatus='completed'}
  save();toast('Sample handover confirmed. No delivery took place.');render()
}
function simulateGpsPing(){
  const d=getTrackedDelivery(),o=d&&db.orders.find(function(x){return x.id===d.orderId});
  if(currentAccount()?.role!=='delivery_agent'||!o||o.deliveryAgentId!==activeAgent()?.id||o.assignmentStatus!=='picked_up'||o.status!=='Out for delivery'){toast('Only the assigned courier can update location after confirming pickup.');return}
  if(d.status==='Delivered'){toast('This sample route is complete.');return}
  if(liveWatchId!==null){navigator.geolocation.clearWatch(liveWatchId);liveWatchId=null;livePosition=null}
  d.progress=Math.min((d.progress||0)+1,demoRoute.length-1);d.lastPingAt=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});d.etaMinutes=Math.max(0,12-d.progress*2);
  stage(d,'pickup',true,'Courier checked the sample order out of the kitchen.');stage(d,'transit',true,'Courier is moving along the sample route.');
  const reached=geofenceCheck(d,demoRoute[d.progress],5);if(!reached)save();render()
}
const startDeviceGpsPrototype=startDeviceGps;
function startDeviceGps(){
  const d=getTrackedDelivery(),o=d&&db.orders.find(function(x){return x.id===d.orderId});
  if(currentAccount()?.role!=='delivery_agent'||!o||o.deliveryAgentId!==activeAgent()?.id||o.assignmentStatus!=='picked_up'){toast('Only the assigned courier can share location after pickup.');return}
  startDeviceGpsPrototype()
}
function trackingView(){
  const d=getTrackedDelivery();
  if(!d)return '<section class="dashboard shell"><h1>Delivery tracking</h1><p class="muted">No eligible sample delivery is available yet.</p><button class="btn" onclick="go(&quot;menu&quot;)">Browse meals</button></section>';
  const o=db.orders.find(function(x){return x.id===d.orderId}),role=currentAccount()?.role,agent=role==='delivery_agent',inside=d.status==='Inside delivery zone',delivered=d.status==='Delivered';
  const courierReady=agent&&o?.assignmentStatus==='picked_up'&&o?.status==='Out for delivery';
  const handover=role==='customer'&&inside&&!delivered?'<div class="field codeField"><label for="deliveryOtp">Demo handover code · 2468</label><input id="deliveryOtp" inputmode="numeric" maxlength="4" placeholder="Enter code"></div><button class="btn" onclick="confirmDemoHandover()">Confirm sample handover</button>':'';
  const courierControls=courierReady?'<button class="btn" onclick="simulateGpsPing()">Simulate next courier ping</button><button class="btn alt" onclick="'+(liveWatchId!==null?'stopDeviceGps()':'startDeviceGps()')+'">'+(liveWatchId!==null?'Stop device GPS':'Use this device GPS')+'</button>':'';
  const roleNote=agent?'Your approved demo account can see its assigned route after pickup. Device GPS is optional and stays local in this browser.':'Customer view: the illustrative location route is sample data and is not a live courier feed.';
  return '<section class="dashboard shell"><div class="dashhead"><div><div class="eyebrow">Delivery tracking · sample order</div><h1>'+esc(delivered?'Your order is complete':inside?'Courier has arrived nearby':'Follow your meal to the door')+'</h1><div class="muted">'+esc(d.zoneName)+' · Order '+esc(d.orderId)+' · '+esc(o?.meal||'Home-style meal')+'</div></div><span class="tag '+(delivered?'':'orange')+'">'+esc(d.status)+'</span></div><div class="trackingRoleNote">'+roleNote+'</div><div class="deliveryHero"><div class="paneltitle"><div><div class="eyebrow">Courier '+esc(d.courier||'Awaiting assignment')+'</div><h2 style="margin:4px 0 0">'+esc(d.status)+'</h2></div><span class="tag '+(delivered?'':inside?'':'orange')+'">'+(delivered?'Handover recorded':inside?'Arrived in zone':esc(String(d.etaMinutes))+' min estimate')+'</span></div><div class="deliveryStatRow"><div class="deliveryStat"><span>Illustrative distance</span><strong>'+readableDistance(d)+' m</strong></div><div class="deliveryStat"><span>Sample arrival boundary</span><strong>'+esc(String(d.radiusMeters))+' m</strong></div><div class="deliveryStat"><span>Location ping</span><strong>'+esc(d.lastPingAt||'Waiting')+'</strong></div></div><div class="deliveryLayout"><div>'+deliveryMap(d)+'<div class="gpsBanner" style="margin-top:12px"><b>Location privacy:</b> this sample location is not stored on Paustik servers. The illustrative route is not street accurate.</div></div><div class="card"><div class="paneltitle"><h3>Delivery progress</h3><span class="tag">'+d.events.filter(function(x){return x.complete}).length+' / '+d.events.length+' steps</span></div><ol class="timeline">'+d.events.map(function(e){return '<li class="'+(e.complete?'complete':'')+'"><strong>'+esc(e.label)+'</strong><small>'+esc(e.detail)+(e.at?' · '+esc(e.at):'')+'</small></li>'}).join('')+'</ol></div></div><div class="actions" style="margin-top:17px">'+courierControls+handover+(delivered?'<span class="tag">Sample order completed ✓</span>':'')+'</div><p class="portalHint">Boundary: '+esc(d.lastBoundaryEvent||'Waiting for courier pickup')+'</p><p class="portalHint">Sample payment: not processed. No charge or settlement was made.</p></div><div class="card" style="margin-top:17px"><h3>Live service requirements</h3><p class="muted small">Real customer accounts, orders, dispatch assignment, courier tracking, and payment are not connected to these browser-local sample records. The separate tracking-link backend is a pilot and is not yet wired into marketplace orders.</p></div></section>'
}
function resetDemo(){
  if(liveWatchId!==null){navigator.geolocation.clearWatch(liveWatchId);liveWatchId=null;livePosition=null}
  if(!confirm('Reset this browser to the original fictional sample data?'))return;
  localStorage.removeItem(KEY);db=load();ensureDemoAccounts();db.session=null;save();route='auth';authMode='signin';toast('Local demo reset.');render()
}

function saveKitchen(){const m=activeMother(),capacity=document.querySelector('#capacity'),availability=document.querySelector('#availability');if(currentAccount()?.role!=='mother'||!m||!m.verified)return;const n=Math.max(0,Math.min(200,Number(capacity?.value)||0));m.capacity=n;m.available=!!availability?.checked;save();toast('Sample kitchen settings saved.');render()}

window.addEventListener('pagehide',()=>{if(liveWatchId!==null)navigator.geolocation.clearWatch(liveWatchId)});render();
